name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check bin/support tests
      - name: skill copies match bin/support
        run: |
          cmp bin/support skills/nano-support-collect/scripts/support
          cmp bin/support skills/nano-support-investigate/scripts/support

  test:
    # ubuntu-latest no longer ships Python 3.9, which we still support
    # (RHEL 8 / Debian 11 hosts), so the 3.9 leg runs on ubuntu-22.04.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/fetch_nano_tool.py
      - run: python -m unittest discover -s tests -v

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python tests/fetch_nano_tool.py
      - run: SUPPORT_TEST_DOCKER=1 python -m unittest discover -s tests -v
